name: Publish homepage when public

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-homepage-pages
  cancel-in-progress: true

jobs:
  build:
    # A private source repository does not guarantee a private Pages website.
    # Keep publishing disabled until the owner makes the repository public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build website files only
        run: python3 build.py --output-dir _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Enable Pages with GitHub Actions in repository settings before publishing.
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
